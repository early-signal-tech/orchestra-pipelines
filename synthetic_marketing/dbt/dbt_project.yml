name: 'marketing_analytics'
version: '1.0.0'
profile: 'marketing_analytics'

clean-targets:
  - "target"
  - "dbt_packages"

models:
  marketing_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view
      # With Orchestra state orchestration, rebuild at most once a day; parents inherit it.
      +freshness:
        build_after:
          count: 1
          period: day
